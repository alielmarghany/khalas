<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0f1a;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="45"
      data-width="1080"
      data-height="1920"
    >
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="problem" data-composition-id="problem" data-composition-src="compositions/problem.html"
        data-start="4" data-duration="6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="turn" data-composition-id="turn" data-composition-src="compositions/turn.html"
        data-start="10" data-duration="3" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="chat2order" data-composition-id="chat2order" data-composition-src="compositions/chat2order.html"
        data-start="13" data-duration="7" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="nightbot" data-composition-id="nightbot" data-composition-src="compositions/nightbot.html"
        data-start="20" data-duration="7" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="board" data-composition-id="board" data-composition-src="compositions/board.html"
        data-start="27" data-duration="7" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="solution" data-composition-id="solution" data-composition-src="compositions/solution.html"
        data-start="34" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="38" data-duration="7" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
