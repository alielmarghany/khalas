  <div id="root" data-composition-id="board" data-width="1080" data-height="1920">
    <div id="bd-head">
      <div class="ar"><span>وكل</span> <span>أوردر</span> <span>في</span> <span class="k">مكانه</span></div>
      <div class="en" id="bd-en">Every order in its place.</div>
    </div>

    <div id="bd-board" data-layout-allow-overlap>
      <div class="bd-col" id="bd-col0"><div class="hd"><span>جديد</span><span class="bd-cnt" id="bd-k0"><b>٠</b><b>١</b><b>٢</b><b>٣</b><b>٤</b><b>٥</b></span></div></div>
      <div class="bd-col" id="bd-col1"><div class="hd"><span>اتأكد</span><span class="bd-cnt" id="bd-k1"><b>٠</b><b>١</b><b>٢</b><b>٣</b><b>٤</b><b>٥</b></span></div></div>
      <div class="bd-col" id="bd-col2"><div class="hd"><span>اتشحن</span><span class="bd-cnt" id="bd-k2"><b>٠</b><b>١</b><b>٢</b><b>٣</b><b>٤</b><b>٥</b></span></div></div>

      <div class="bd-card" id="bd-o0" style="left: 434px; top: 90px"><span class="n">#١٠٢٤</span><span class="t">تيشيرت ×٢</span></div>
      <div class="bd-card" id="bd-o1" style="left: 434px; top: 188px"><span class="n">#١٠٢٥</span><span class="t">هودي M</span></div>
      <div class="bd-card" id="bd-o2" style="left: 434px; top: 286px"><span class="n">#١٠٢٦</span><span class="t">شنطة جلد</span></div>
      <div class="bd-card" id="bd-o3" style="left: 434px; top: 384px"><span class="n">#١٠٢٧</span><span class="t">فستان</span></div>
      <div class="bd-card" id="bd-o4" style="left: 434px; top: 482px"><span class="n">#١٠٢٨</span><span class="t">كاب أسود</span></div>
    </div>

    <div id="bd-line">
      <div class="ar"><span>ولا</span> <span>ورقة.</span> <span>ولا</span> <span>إكسل.</span></div>
      <div class="en" id="bd-len">No paper. No spreadsheets.</div>
    </div>
    <div id="bd-wipe"></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const COLX = [434, 222, 10];
      const SLOTY = [90, 188, 286, 384, 482];

      tl.fromTo("#bd-head .ar span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.08, ease: "power3.out" }, 0.1);
      tl.fromTo("#bd-en", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.45);
      tl.fromTo(".bd-col", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.08, ease: "expo.out" }, 0.3);

      // counters: one digit shown at a time
      const shown = [0, 0, 0];
      const setCount = (col, n, at) => {
        tl.set(`#bd-k${col} b:nth-child(${shown[col] + 1})`, { opacity: 0 }, at);
        tl.set(`#bd-k${col} b:nth-child(${n + 1})`, { opacity: 1 }, at);
        tl.fromTo(`#bd-k${col}`, { scale: 1.35 }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, at);
        shown[col] = n;
      };
      [0, 1, 2].forEach((c) => tl.set(`#bd-k${c} b:nth-child(1)`, { opacity: 1 }, 0));

      // state: which column each order is in, in arrival order
      const col = [-1, -1, -1, -1, -1];
      const pos = {};
      const layout = (at, dur) => {
        const counts = [0, 0, 0];
        for (let i = 0; i < 5; i++) {
          if (col[i] < 0) continue;
          const c = col[i];
          const slot = counts[c]++;
          const x = COLX[c] - COLX[0];
          const y = SLOTY[slot] - SLOTY[i];
          const key = x + "," + y;
          if (pos[i] !== key) {
            tl.to("#bd-o" + i, { x, y, duration: dur, ease: "power3.inOut" }, at);
            pos[i] = key;
          }
        }
        counts.forEach((n, c) => { if (n !== shown[c]) setCount(c, n, at + dur * 0.8); });
      };

      // orders arrive in جديد
      for (let i = 0; i < 5; i++) {
        const at = 0.75 + i * 0.16;
        tl.fromTo("#bd-o" + i, { opacity: 0, x: 260, y: 0 }, { opacity: 1, x: 0, y: 0, duration: 0.45, ease: "expo.out" }, at);
        pos[i] = "0,0";
        col[i] = 0;
        setCount(0, i + 1, at + 0.3);
      }

      // they move through the pipeline
      const moves = [
        [1.9, 0, 1], [2.45, 1, 1], [3.0, 0, 2], [3.4, 2, 1],
        [3.9, 1, 2], [4.3, 3, 1], [4.8, 2, 2],
      ];
      moves.forEach(([at, i, c]) => { col[i] = c; layout(at, 0.45); });

      tl.fromTo("#bd-line .ar span", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.12, ease: "expo.out" }, 5.0);
      tl.fromTo("#bd-len", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5.5);

      tl.fromTo("#bd-wipe", { xPercent: 100 }, { xPercent: 0, duration: 0.3, ease: "power3.in" }, 6.65);

      window.__timelines["board"] = tl;
    })();
  </script>
