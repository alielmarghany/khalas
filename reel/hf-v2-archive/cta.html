  <div id="root" data-composition-id="cta" data-width="1080" data-height="1920" data-layout-allow-overlap>

    <div id="ct-logo">
      <svg id="ct-mark" width="210" height="210" viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="46" rx="14" fill="#fff"/><path d="M12 46 L10 62 L28 50 Z" fill="#fff"/><path id="ct-tick" d="M19 28 L29 38 L46 18" fill="none" stroke="#2B3BFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" opacity="0"/></svg>
      <div id="ct-wm">khalas</div>
      <div id="ct-wmar">خلاص</div>
    </div>

    <div id="ct-count"><span class="tape"><span id="ct-num">٤٠٩</span> مكان للمؤسسين بس</span></div>
    <div id="ct-mini"><span class="tape"><span id="ct-live"></span>٤٠٠ 🔥</span></div>
    <div id="ct-mini-en" class="sub-en">Only 400 founder spots</div>

    <div id="ct-type">
      <div id="ct-l1"><span class="tape k">اكتب</span> <span class="tape">«خلاص»</span></div>
      <div id="ct-l2"><span class="tape w">في الكومنت 👇</span></div>
    </div>
  </div>
  <script>
    (function(){
      const tl = gsap.timeline({ paused: true });
      const BEAT = 60 / 128;
      const ar = n => String(n).replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

      // 0.00 the logo lands on the blue the icon became; its tick draws on the boom
      tl.fromTo("#ct-logo", { scale: 1.5, opacity: 0.0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "expo.out" }, 0);
      tl.set("#ct-tick", { opacity: 1 }, 0.08);
      tl.to("#ct-tick", { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, 0.08);
      tl.fromTo("#ct-grid", { scale: 1.15 }, { scale: 1, duration: 0.8, ease: "expo.out" }, 0);

      // 0.18 founder counter slaps in and ticks down to 400
      tl.fromTo("#ct-count", { scale: 1.4, rotation: 6, opacity: 0 }, { scale: 1, rotation: -2, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0.16);
      const c = { v: 409 };
      tl.fromTo(c, { v: 409 }, { v: 400, duration: 0.36, ease: "power2.out", onUpdate: () => { document.querySelector("#ct-num").textContent = ar(Math.round(c.v)); } }, 0.2);

      // 0.60 make room for the ask: logo up and smaller, counter collapses to the number
      tl.to("#ct-logo", { y: -150, scale: 0.5, duration: 0.34, ease: "power3.inOut" }, 0.56);
      tl.to("#ct-wmar", { opacity: 0, duration: 0.12 }, 0.56);
      tl.to("#ct-count", { opacity: 0, filter: "blur(10px)", scale: 0.9, duration: 0.14, ease: "power2.in" }, 0.58);
      tl.fromTo("#ct-mini", { opacity: 0, filter: "blur(10px)", scale: 1.2 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.2, ease: "expo.out" }, 0.78);
      tl.fromTo("#ct-mini-en", { opacity: 0 }, { opacity: 0.9, duration: 0.15 }, 0.9);

      // the ask lands with the voice: "اكتب «خلاص»" … "في الكومنت"
      tl.fromTo("#ct-l1", { scale: 1.35, rotation: -7, opacity: 0 }, { scale: 1, rotation: -2, opacity: 1, duration: 0.32, ease: "back.out(2)" }, 0.66);
      tl.fromTo("#ct-l2", { scale: 1.35, rotation: 7, opacity: 0 }, { scale: 1, rotation: 2, opacity: 1, duration: 0.32, ease: "back.out(2)" }, 1.16);

      // the counter pulses on the beat until the end; the live dot blinks with it
      // beats are counted on the film's clock (this scene starts at 12 s) so the pulse sits on the music
      const SCENE_START = 12;
      for (let k = Math.ceil((SCENE_START + 1.0) / BEAT); k * BEAT - SCENE_START < 2.95; k++) {
        const t = Math.round(k * BEAT * 30) / 30 - SCENE_START;
        tl.fromTo("#ct-mini .tape", { scale: 1.1 }, { scale: 1, duration: 0.3, ease: "power2.out" }, t);
        tl.fromTo("#ct-live", { opacity: 1 }, { opacity: 0.25, duration: 0.3, ease: "power1.in" }, t);
      }
      window.__timelines["cta"] = tl;
    })();
  </script>
