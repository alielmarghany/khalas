  <script>
    (function(){
      const tl = gsap.timeline({ paused: true });
      const YEL = "#FFD21F", WHITE = "#ffffff";
      function group(sel, start, end, times) {
        tl.set(sel, { visibility: "visible" }, start);
        tl.fromTo(sel, { opacity: 0, scale: 0.88, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "expo.out" }, start);

          if (i < times.length - 1) tl.to(w, { color: WHITE, scale: 1, duration: 0.08 }, times[i + 1]);
        });
        tl.to(sel, { opacity: 0, duration: 0.1, ease: "power2.in" }, end - 0.1);
        tl.set(sel, { opacity: 0, visibility: "hidden" }, end);
