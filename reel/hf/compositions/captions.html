    <div class="cg" id="cg4"><span class="w" id="cg4-w0">الباقي</span> <span class="w" id="cg4-w1">ضاع</span> <span class="w" id="cg4-w2">في</span> <span class="w" id="cg4-w3">الشات</span></div>

  <script>
    (function(){
      const tl = gsap.timeline({ paused: true });
      const YEL = "#FFD21F", WHITE = "#ffffff";
      // one group at a time: pops in, the spoken word turns yellow, hard kill at the end
      function group(sel, start, end, times) {
        tl.set(sel, { visibility: "visible" }, start);
        tl.fromTo(sel, { opacity: 0, scale: 0.86, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.12, ease: "expo.out" }, start);
        times.forEach((t, i) => {
          const w = sel + "-w" + i;
          tl.fromTo(w, { color: WHITE, scale: 1 }, { color: YEL, scale: 1.12, duration: 0.08, ease: "power2.out" }, t);
          if (i < times.length - 1) tl.to(w, { color: WHITE, scale: 1, duration: 0.08 }, times[i + 1]);
        });
        tl.to(sel, { opacity: 0, duration: 0.1, ease: "power2.in" }, end - 0.1);
        tl.set(sel, { opacity: 0, visibility: "hidden" }, end);
      }
      group("#cg1", 0.1, 0.98, [0.1, 0.29]);
      group("#cg2", 0.98, 1.46, [0.98, 1.12]);
      group("#cg3", 1.5, 2.62, [1.5, 1.99]);
      group("#cg4", 2.82, 4.62, [2.87, 3.24, 3.47, 3.6]);
      group("#cg5", 5.1, 6.46, [5.15, 5.62, 6.04]);
      group("#cg6", 6.46, 7.62, [6.52, 6.94]);
      group("#cg7", 13.8, 15.0, [13.86, 14.23]);
      window.__timelines["captions"] = tl;
