<!doctype html>
<html lang="ar"
  data-composition-variables='[
    {"id":"brand-blue","type":"color","label":"Brand blue","default":"#2B3BFF"},
    {"id":"brand-yellow","type":"color","label":"Brand yellow","default":"#FFD21F"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #2B3BFF; }
      #root { width: 100%; height: 100%; position: relative; }
      #captions { z-index: 50; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15"
         data-width="1080" data-height="1920">

      <!-- scenes: one lane, back to back -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
           data-start="0" data-duration="2.62" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920"></div>
      <div id="loss" data-composition-id="loss" data-composition-src="compositions/loss.html"
           data-start="2.62" data-duration="2.38" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920"></div>
      <div id="order" data-composition-id="order" data-composition-src="compositions/order.html"
           data-start="5" data-duration="4" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920"></div>
      <div id="night" data-composition-id="night" data-composition-src="compositions/night.html"
           data-start="9" data-duration="3" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
           data-start="12" data-duration="3" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920"></div>

      <!-- every caption group lives in one captions host -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
           data-start="0" data-duration="15" data-track-index="2" data-track-kind="captions"
           data-width="1080" data-height="1920"></div>

      <!-- voice (one lane), music, sound effects -->
      <audio id="vo1" class="clip" src="assets/audio/vo1.wav" data-duration="2.58" data-start="0.05" data-track-index="3" data-volume="1"></audio>
      <audio id="vo2" class="clip" src="assets/audio/vo2.wav" data-duration="1.63" data-start="2.75" data-track-index="3" data-volume="1"></audio>
      <audio id="vo3" class="clip" src="assets/audio/vo3.wav" data-duration="2.26" data-start="5.1" data-track-index="3" data-volume="1"></audio>
      <audio id="vo4" class="clip" src="assets/audio/vo4.wav" data-duration="2.26" data-start="9.25" data-track-index="3" data-volume="1"></audio>
      <audio id="vo5" class="clip" src="assets/audio/vo5.wav" data-duration="2.23" data-start="12.6" data-track-index="3" data-volume="1"></audio>
      <audio id="music" class="clip" src="assets/audio/music.wav" data-start="0" data-duration="15" data-track-index="4" data-volume="1"></audio>
      <audio id="sfx" class="clip" src="assets/audio/sfx.wav" data-start="0" data-duration="15" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
