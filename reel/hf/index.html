<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0E1338; }
      #root { width: 100%; height: 100%; position: relative; }
      #type { z-index: 20; }
      #captions { z-index: 50; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <!-- the 3D phone: one continuous scene, the camera does the cutting -->
      <div id="stage" data-composition-id="stage" data-composition-src="compositions/stage.html"
           data-start="0" data-duration="15" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920"></div>
      <!-- headlines over the phone -->
      <div id="type" data-composition-id="type" data-composition-src="compositions/type.html"
           data-start="0" data-duration="15" data-track-index="2" data-track-kind="graphics"
           data-width="1080" data-height="1920"></div>
      <!-- every caption group lives in one captions host -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
           data-start="0" data-duration="15" data-track-index="3" data-track-kind="captions"
           data-width="1080" data-height="1920"></div>
      <!-- voice (one lane), music, sound effects -->
      <audio id="vo1" class="clip" src="assets/audio/vo1.wav" data-start="0.05" data-duration="3.02" data-track-index="4" data-volume="0.56"></audio>
      <audio id="vo2" class="clip" src="assets/audio/vo2.wav" data-start="3.22" data-duration="3.49" data-track-index="4" data-volume="0.56"></audio>
      <audio id="vo3" class="clip" src="assets/audio/vo3.wav" data-start="6.75" data-duration="2.67" data-track-index="4" data-volume="0.56"></audio>
      <audio id="vo4" class="clip" src="assets/audio/vo4.wav" data-start="9.55" data-duration="2.42" data-track-index="4" data-volume="0.56"></audio>
      <audio id="vo5" class="clip" src="assets/audio/vo5.wav" data-start="12.1" data-duration="2.0" data-track-index="4" data-volume="0.56"></audio>
      <audio id="music" class="clip" src="assets/audio/music.wav" data-start="0" data-duration="15" data-track-index="5" data-volume="0.36"></audio>
      <audio id="sfx" class="clip" src="assets/audio/sfx.wav" data-start="0" data-duration="15" data-track-index="6" data-volume="0.4"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
